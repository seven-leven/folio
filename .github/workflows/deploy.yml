name: Check & deploy

# Every push and PR is checked. Only main deploys, and only if the check passes.
# gh-pages is a build artifact of main: never commit to it directly. Each
# deploy builds site/ into dist/ and publishes it as a fresh orphan commit.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history: the version number is the commit count)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Build and check links, images, anchors and page metadata
        run: deno task check

      - name: Phone tap test (no invisible tappable links)
        run: deno task tap-test

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code (full history: the version number is the commit count)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
