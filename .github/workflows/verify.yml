name: Verify

# The checks, defined once. ci.yml runs them on pull requests and on dev;
# deploy.yml runs them on main before it publishes.
on:
  workflow_call: {}

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code with full history (the version number is the commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Build and check links, images, anchors and page metadata
        run: npm run check
