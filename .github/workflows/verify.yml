name: Verify

# The checks, defined once. ci.yml runs them on pull requests and on dev;
# deploy.yml runs them on main before it publishes.
on:
  workflow_call: {}

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code with full history (the version number is the commit count)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Build and check links, images, anchors and page metadata
        run: deno task check
